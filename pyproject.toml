[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "plasmid-oracle"
version = "0.2.0a1"
description = "Evidence-first plasmid annotation and characterization"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "Plasmid Oracle contributors" },
]
keywords = [
  "amr",
  "annotation",
  "bioinformatics",
  "dna",
  "plasmid",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]
dependencies = [
  "platformdirs>=4.3,<5",
  "pyrodigal>=3.7,<4",
]

[project.urls]
Homepage = "https://github.com/McClain-Thiel/PlasmidOracle"
Documentation = "https://mcclain-thiel.github.io/PlasmidOracle/"
Issues = "https://github.com/McClain-Thiel/PlasmidOracle/issues"
Repository = "https://github.com/McClain-Thiel/PlasmidOracle"

[project.optional-dependencies]
plannotate = [
  "pandas>=1.5,<3",
  "plannotate-python>=1.2.9,<2",
]

[project.scripts]
plasmid-oracle = "plasmid_oracle.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pandas>=1.5,<3",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]
docs = [
  "mkdocs-material>=9.6,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plasmid_oracle = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: runs real external bioinformatics tools and databases",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
extend-exclude = [".tools"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/plasmid_oracle"]
