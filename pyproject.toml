[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "plasmid-oracle"
version = "0.2.0a0"
description = "Evidence-first plasmid annotation and characterization"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Plasmid Oracle contributors" },
]
dependencies = [
  "platformdirs>=4.3,<5",
  "pyrodigal>=3.7,<4",
]

[project.optional-dependencies]
plannotate = [
  "pandas>=1.5,<3",
  "plannotate-python>=1.2.9,<2",
]

[project.scripts]
plasmid-oracle = "plasmid_oracle.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plasmid_oracle = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: runs real external bioinformatics tools and databases",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
extend-exclude = [".tools"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/plasmid_oracle"]
